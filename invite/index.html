<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join me on wdyw?</title>
  <meta name="description" content="Swipe on restaurants together — no more arguing about where to eat." />

  <!-- Open Graph — drives the iMessage branded card -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://wdyw.io/invite" />
  <meta property="og:title" content="Join me on wdyw?" />
  <meta property="og:description" content="Swipe on restaurants together — no more arguing about where to eat." />
  <meta property="og:image" content="https://wdyw.io/og-invite.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Join me on wdyw?" />
  <meta name="twitter:description" content="Swipe on restaurants together — no more arguing about where to eat." />
  <meta name="twitter:image" content="https://wdyw.io/og-invite.png" />

  <!-- Safari Smart App Banner: OPEN if installed, GET if not -->
  <meta name="apple-itunes-app" content="app-id=6761072597" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --flame: #FF4E2A;
      --ember: #FF8C00;
      --char: #1C0D00;
      --cream: #FFF4EE;
      --dim: #7A5C4A;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--char);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo { font-size: 42px; font-weight: 900; color: var(--flame); margin-bottom: 16px; }
    .invite-text { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 15px; color: var(--dim); margin-bottom: 32px; line-height: 1.6; }

    /* Invite code box */
    .code-section { margin-bottom: 32px; }
    .code-label { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .code-box {
      display: inline-block;
      background: rgba(255, 78, 42, 0.12);
      border: 2px dashed var(--flame);
      border-radius: 16px;
      padding: 16px 28px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--cream);
      cursor: pointer;
      user-select: all;
      transition: background 0.15s;
      min-width: 200px;
    }
    .code-box:hover { background: rgba(255, 78, 42, 0.2); }
    .code-hint {
      font-size: 13px;
      color: var(--dim);
      margin-top: 10px;
      transition: color 0.2s;
    }
    .code-hint.copied { color: var(--flame); font-weight: 600; }

    /* Buttons */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, var(--flame), var(--ember));
      color: white;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 32px;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      background: rgba(255,255,255,0.06);
      color: var(--cream);
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 32px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .steps {
      font-size: 13px;
      color: var(--dim);
      margin-top: 24px;
      line-height: 1.8;
    }
    .steps strong { color: var(--cream); }
  </style>
</head>
<body>
  <div class="logo">wdyw?</div>
  <p class="invite-text">You've been invited!</p>
  <p class="subtitle">Swipe on restaurants together —<br>like Tinder, but for dinner.</p>

  <div id="codeSection" class="code-section" style="display:none">
    <p class="code-label">Your invite code</p>
    <div id="codeBox" class="code-box" role="button" tabindex="0" aria-label="Invite code, tap to copy">—</div>
    <p id="codeHint" class="code-hint">Tap to copy</p>
  </div>

  <a href="https://apps.apple.com/app/id6761072597" class="btn-primary">📱 Download on the App Store</a>
  <a href="/" class="btn-secondary">Learn More</a>

  <p id="steps" class="steps" style="display:none">
    1. Download wdyw? above<br>
    2. Open the app and go to <strong>Friends</strong><br>
    3. Tap <strong>Add Friend</strong> and enter the code above
  </p>

  <script>
    (function () {
      // Extract invite code from path: /invite/4222KA7S
      var match = window.location.pathname.match(/\/invite\/([A-HJ-NP-Z2-9]{4,12})/i);
      var code = match ? match[1].toUpperCase() : null;

      if (code) {
        var section = document.getElementById('codeSection');
        var box = document.getElementById('codeBox');
        var hint = document.getElementById('codeHint');
        var steps = document.getElementById('steps');

        section.style.display = 'block';
        steps.style.display = 'block';
        box.textContent = code;

        // Tap to copy
        function copyCode() {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(code).then(function () {
              hint.textContent = '✓ Copied! Paste it in Friends → Add Friend';
              hint.classList.add('copied');
            });
          }
        }
        box.addEventListener('click', copyCode);
        box.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') copyCode();
        });

        // Try universal / custom-scheme deep link to open the app if installed
        // Falls back gracefully to this page
        var appUrl = 'wdyw://invite/' + code;
        try {
          var iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = appUrl;
          document.body.appendChild(iframe);
          setTimeout(function () { document.body.removeChild(iframe); }, 2000);
        } catch (e) {}
      }
    })();
  </script>
</body>
</html>
